<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>27SS Summer 품평 (미참석 매장)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#F7F5EF; --surface:#FFFFFF; --surface-2:#EFEBDF; --ink:#211F19; --ink-soft:#6C6659;
    --line:#E1DCCC; --accent:#55603C; --accent-strong:#3A4328; --accent-soft:#E7E8D6;
    --good:#2F7A4F; --good-soft:#E3F1E7; --warn:#AD7A0C; --warn-soft:#F6EAD1; --bad:#B23B3B; --bad-soft:#F5E2E0;
    --done-blue:#2F5FD6; --done-blue-soft:#E6ECFB; --photo-bg:#FFFFFF;
    --radius:14px; --shadow:0 1px 2px rgba(33,31,25,.06), 0 8px 24px -12px rgba(33,31,25,.18);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:86px;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums;line-height:1.5;padding-bottom:88px;}
  h1,h2,h3{font-family:"Noto Serif KR","Noto Sans KR",serif;font-weight:700;text-wrap:balance;margin:0;}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px;}
  .topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;}
  .brand .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .brand h1{font-size:18px;}
  .store-chip{font-size:12px;color:var(--ink-soft);background:var(--surface-2);border-radius:999px;padding:6px 12px;display:none;white-space:nowrap;}
  .progress-wrap{width:100%;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
  .progress-bar{height:100%;background:var(--accent);width:0%;transition:width .3s ease;}
  main{max-width:960px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .panel.disabled{opacity:.45;pointer-events:none;}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .panel-head h2{font-size:17px;}
  .panel-sub{font-size:12.5px;color:var(--ink-soft);}
  .panel-collapsible.collapsed .panel-head{margin-bottom:0;}
  .panel-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12.5px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft);border:none;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;}
  .panel-toggle:hover{background:var(--surface-2);}
  .panel-chevron{display:inline-block;font-size:10px;transition:transform .2s ease;}
  .panel-collapsible.collapsed .panel-chevron{transform:rotate(-90deg);}
  .panel-collapsible.collapsed .panel-body{display:none;}
  .field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media (max-width:640px){.field-row{grid-template-columns:1fr;}}
  label.field-label{font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;display:block;}
  select, textarea, input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;appearance:none;}
  select:disabled{opacity:.5;}
  textarea{resize:vertical;min-height:64px;}
  .qrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);}
  .qrow:last-child{border-bottom:none;}
  .qrow-top{display:flex;gap:10px;align-items:baseline;}
  .qnum{font-size:12px;color:var(--accent);font-weight:700;min-width:20px;}
  .qtext{font-size:14px;font-weight:500;}
  .likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .likert label{position:relative;display:block;}
  .likert input{position:absolute;opacity:0;inset:0;cursor:pointer;}
  .likert span{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 4px 8px;font-size:11px;color:var(--ink-soft);cursor:pointer;transition:.15s;height:64px;line-height:1.25;}
  .likert span b{font-family:"Noto Serif KR",serif;font-size:15px;color:var(--ink);}
  .likert input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);}
  .likert input:checked + span b{color:var(--accent-strong);}
  .likert input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px;}
  .likert-guide-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  .likert-guide{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px;}
  .likert-guide-cell{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;border:1px dashed var(--line);border-radius:10px;padding:10px 4px 8px;font-size:11px;color:var(--ink-soft);height:64px;line-height:1.25;background:var(--surface-2);}
  .likert-guide-cell b{font-family:"Noto Serif KR",serif;font-size:15px;color:var(--ink);}
  .likert-mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .likert-mini label{position:relative;display:block;}
  .likert-mini input{position:absolute;opacity:0;inset:0;cursor:pointer;}
  .likert-mini span{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;font-family:"Noto Serif KR",serif;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;transition:.15s;height:34px;}
  .likert-mini input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);}
  .likert-mini input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px;}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 -20px 14px;padding:10px 20px;position:sticky;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);}
  .tabs{display:flex;gap:6px;background:var(--surface-2);border-radius:10px;padding:4px;}
  .tab-btn{border:none;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);padding:7px 14px;border-radius:8px;cursor:pointer;}
  .tab-btn[aria-pressed="true"]{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow);}
  .search-input{flex:1;min-width:140px;}
  .count-pill{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .card{background:var(--surface);border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;position:relative;transition:.15s;width:100%;}
  .card:hover{border-color:var(--accent);}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .card.done{border-color:var(--done-blue);}
  .card .thumb{aspect-ratio:1.8/1;max-height:220px;background:var(--photo-bg);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .card img{width:100%;height:100%;object-fit:contain;display:block;}
  .card .body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;}
  .card .cat{font-size:10.5px;color:var(--accent-strong);background:var(--accent-soft);align-self:flex-start;padding:2px 7px;border-radius:999px;font-weight:700;}
  .card .style-no{font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  .card .name{font-size:12.5px;font-weight:600;line-height:1.3;min-height:2.4em;}
  .card .price{font-size:12.5px;font-weight:700;margin-top:1px;}
  .card .colors{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .done-tag{font-size:10.5px;color:var(--done-blue);font-weight:700;margin-top:2px;}
  @media (max-width:640px){
    .grid{grid-template-columns:1fr;gap:14px;}
    .card .thumb{aspect-ratio:1.8/1;max-height:230px;}
    .card .body{padding:12px 14px 14px;gap:5px;}
    .card .name{font-size:14.5px;min-height:0;}
    .card .price{font-size:14px;}
    .card .cat,.card .style-no,.card .colors{font-size:12px;}
  }
  .empty-state{padding:40px 10px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px -12px rgba(0,0,0,.15);}
  .bottombar-inner{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;}
  .bottombar .stat{font-size:12px;color:var(--ink-soft);}
  .bottombar .stat b{color:var(--ink);font-size:14px;}
  .btn{font:inherit;font-weight:700;border-radius:10px;border:1px solid transparent;padding:11px 18px;cursor:pointer;font-size:14px;}
  .btn-primary{background:var(--accent);color:#fff;margin-left:auto;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{background:var(--surface-2);color:var(--ink);}
  .btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-outline:disabled{opacity:.35;cursor:not-allowed;}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,18,12,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  @media (min-width:720px){.modal-overlay{align-items:center;}}
  .modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;}
  @media (min-width:720px){.modal{border-radius:18px;}}
  .modal-hero{position:relative;aspect-ratio:1.8/1;max-height:280px;background:var(--photo-bg);display:flex;align-items:center;justify-content:center;}
  .modal-hero img{width:100%;height:100%;object-fit:contain;display:block;}
  .modal-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:999px;border:none;background:rgba(255,255,255,.92);color:#211F19;font-size:16px;cursor:pointer;}
  .modal-body{padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px;}
  .modal-title .cat{font-size:11px;color:var(--accent-strong);background:var(--accent-soft);padding:3px 9px;border-radius:999px;font-weight:700;}
  .modal-title h3{font-size:19px;margin-top:6px;}
  .modal-title .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;font-size:12.5px;background:var(--surface-2);border-radius:12px;padding:14px 16px;}
  .detail-grid dt{color:var(--ink-soft);}
  .detail-grid dd{margin:0;font-weight:600;}
  .detail-grid .concept{grid-column:1/-1;font-weight:400;color:var(--ink);}
  .colorlist{display:flex;flex-wrap:wrap;gap:6px;}
  .colorlist span{font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;}
  .crit-block{display:flex;flex-direction:column;gap:16px;}
  .modal-actions{display:flex;gap:10px;position:sticky;bottom:0;background:var(--surface);padding-top:8px;}
  .nav-btn{flex:1;}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .done-screen{max-width:520px;margin:60px auto;text-align:center;padding:0 16px;display:flex;flex-direction:column;gap:16px;align-items:center;}
  .done-screen .icon{width:56px;height:56px;border-radius:999px;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center;font-size:26px;}
  .error-banner{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .hint{font-size:12px;color:var(--ink-soft);}
  .required-star{color:var(--bad);}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="eyebrow">KANGOL KOREA · 27SS SUMMER REVIEW · 미참석 매장</span>
      <h1>27SS Summer 품평 평가</h1>
    </div>
    <span class="store-chip" id="storeChip"></span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</header>

<main>
  <section class="panel panel-collapsible" id="storePanel">
    <div class="panel-head">
      <h2>1. 평가 매장 정보</h2>
      <span class="panel-sub">채널 → 채널계열 → 매장명 순서로 선택해주세요</span>
      <button type="button" class="panel-toggle" id="storePanelToggle" aria-expanded="true"><span class="panel-chevron">▾</span>접기</button>
    </div>
    <div class="panel-body" id="storePanelBody">
      <div class="field-row">
        <div>
          <label class="field-label" for="selChannelType">채널형태 <span class="required-star">*</span></label>
          <select id="selChannelType"><option value="">선택</option></select>
        </div>
        <div>
          <label class="field-label" for="selChannelGroup">채널계열 <span class="required-star">*</span></label>
          <select id="selChannelGroup" disabled><option value="">선택</option></select>
        </div>
        <div>
          <label class="field-label" for="selStoreName">매장명 <span class="required-star">*</span></label>
          <select id="selStoreName" disabled><option value="">선택</option></select>
        </div>
      </div>
    </div>
  </section>

  <section class="panel disabled" id="productPanel">
    <div class="panel-head">
      <h2>2. 상품별 평가</h2>
      <span class="panel-sub">카드를 눌러 상세 정보를 보고 점수를 매겨주세요 · 평가 완료 상품은 파란 테두리로 표시됩니다</span>
    </div>
    <div class="toolbar">
      <div class="tabs" id="typeTabs">
        <button class="tab-btn" data-type="의류" aria-pressed="true">의류</button>
        <button class="tab-btn" data-type="가방" aria-pressed="false">가방</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="품번 또는 상품명 검색">
      <span class="count-pill" id="gridCount"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" id="modal">
    <div class="modal-hero">
      <img id="modalImg" src="" alt="">
      <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-title">
        <span class="cat" id="modalCat"></span>
        <h3 id="modalName"></h3>
        <div class="sub" id="modalSub"></div>
      </div>
      <dl class="detail-grid" id="modalDetail"></dl>
      <div>
        <label class="field-label">컬러 구성</label>
        <div class="colorlist" id="modalColors"></div>
      </div>
      <div class="likert-guide-label">평가 척도 안내 · 5점(매우긍정) ~ 1점(매우부정)</div><div class="likert-guide"><div class="likert-guide-cell"><b>5</b><span>매우긍정</span></div><div class="likert-guide-cell"><b>4</b><span>긍정</span></div><div class="likert-guide-cell"><b>3</b><span>보통</span></div><div class="likert-guide-cell"><b>2</b><span>부정</span></div><div class="likert-guide-cell"><b>1</b><span>매우부정</span></div></div>
      <div class="crit-block" id="modalCriteria"></div>
      <div>
        <label class="field-label" for="modalEtc" id="modalEtcLabel">기타 개선 필요사항</label>
        <textarea id="modalEtc" placeholder="자유롭게 의견을 남겨주세요 (선택)"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline nav-btn" id="modalPrev">← 이전 상품</button>
        <button class="btn btn-primary nav-btn" id="modalSave">저장하고 계속</button>
      </div>
    </div>
  </div>
</div>

<div class="bottombar">
  <div class="bottombar-inner">
    <span class="stat"><b id="doneCount">0</b> / <span id="totalCount">0</span> 상품 평가 완료</span>
    <button class="btn btn-primary" id="submitBtn" disabled>결과 제출</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHnbtAFGTNRAbLMZfxIIyoz9L7TF6igjuMM7MS-VUyxGXMGEgw5ZlY6CFnrhm1fn_Gkw/exec";
  var DATA = JSON.parse(document.getElementById('app-data').textContent);
  var PRODUCTS = DATA.products;
  var LIKERT = [5,4,3,2,1];

  var state = {
    channelType: "", channelGroup: "", storeName: "",
    products: {}
  };
  var DRAFT_KEY = "kangol_ss27_summer_absent_v1"; var SURVEY = "SUMMER_ABS";

  function saveDraft(){
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); }catch(e){}
  }
  function loadDraft(){
    try{
      var raw = localStorage.getItem(DRAFT_KEY);
      if(!raw) return;
      var saved = JSON.parse(raw);
      if(saved && typeof saved === 'object'){
        state = Object.assign(state, saved);
      }
    }catch(e){}
  }
  function clearDraft(){
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  }

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  // ---------- Step 1: store selectors ----------
  var selType = document.getElementById('selChannelType');
  var selGroup = document.getElementById('selChannelGroup');
  var selStore = document.getElementById('selStoreName');
  var storeChip = document.getElementById('storeChip');

  // ---------- sticky offsets (toolbar sticks right below the topbar) ----------
  var topbarEl = document.querySelector('.topbar');
  var toolbarEl = document.querySelector('.toolbar');
  function syncStickyOffsets(){
    if(topbarEl && toolbarEl){ toolbarEl.style.top = topbarEl.offsetHeight + 'px'; }
  }
  window.addEventListener('resize', syncStickyOffsets);

  // ---------- collapsible panel (1. 매장 정보) ----------
  var storePanelEl = document.getElementById('storePanel');
  var storePanelToggle = document.getElementById('storePanelToggle');
  var storePanelSub = storePanelEl.querySelector('.panel-sub');
  var storeSubDefault = storePanelSub.textContent;
  var storeAutoCollapsed = false;

  function storeSummaryText(){
    return '✓ ' + [state.channelType, state.channelGroup, state.storeName].filter(Boolean).join(' · ') + ' 선택완료';
  }
  function setPanelCollapsed(panelEl, toggleBtn, subEl, defaultSub, summaryFn, collapsed){
    panelEl.classList.toggle('collapsed', collapsed);
    toggleBtn.setAttribute('aria-expanded', String(!collapsed));
    toggleBtn.innerHTML = '<span class="panel-chevron">▾</span>' + (collapsed ? '펼치기' : '접기');
    if(subEl){ subEl.textContent = collapsed ? summaryFn() : defaultSub; }
  }
  function toggleStorePanel(collapsed){
    setPanelCollapsed(storePanelEl, storePanelToggle, storePanelSub, storeSubDefault, storeSummaryText, collapsed);
  }
  storePanelToggle.addEventListener('click', function(e){
    e.stopPropagation();
    toggleStorePanel(!storePanelEl.classList.contains('collapsed'));
  });

  Object.keys(DATA.stores).forEach(function(t){
    var o = el('option'); o.value = t; o.textContent = t; selType.appendChild(o);
  });

  function fillGroups(type, keepGroup){
    selGroup.innerHTML = '<option value="">선택</option>';
    selStore.innerHTML = '<option value="">선택</option>';
    if(!type){ selGroup.disabled = true; selStore.disabled = true; return; }
    var groups = Object.keys(DATA.stores[type] || {});
    groups.forEach(function(g){
      var o = el('option'); o.value = g; o.textContent = g; selGroup.appendChild(o);
    });
    selGroup.disabled = false;
    selStore.disabled = true;
    if(keepGroup && groups.indexOf(keepGroup) !== -1){
      selGroup.value = keepGroup;
      fillStores(type, keepGroup, state.storeName);
    }
  }
  function fillStores(type, group, keepStore){
    selStore.innerHTML = '<option value="">선택</option>';
    if(!group){ selStore.disabled = true; return; }
    var names = (DATA.stores[type] && DATA.stores[type][group]) || [];
    names.forEach(function(n){
      var o = el('option'); o.value = n; o.textContent = n; selStore.appendChild(o);
    });
    selStore.disabled = false;
    if(keepStore && names.indexOf(keepStore) !== -1){
      selStore.value = keepStore;
    }
  }

  selType.addEventListener('change', function(){
    state.channelType = selType.value;
    state.channelGroup = ""; state.storeName = "";
    fillGroups(state.channelType);
    updateStoreChip();
    updateGates();
    saveDraft();
  });
  selGroup.addEventListener('change', function(){
    state.channelGroup = selGroup.value;
    state.storeName = "";
    fillStores(state.channelType, state.channelGroup);
    updateStoreChip();
    updateGates();
    saveDraft();
  });
  selStore.addEventListener('change', function(){
    state.storeName = selStore.value;
    updateStoreChip();
    updateGates();
    saveDraft();
  });

  function updateStoreChip(){
    if(state.storeName){
      storeChip.style.display = 'inline-block';
      storeChip.textContent = state.channelType + ' · ' + state.channelGroup + ' · ' + state.storeName;
    } else {
      storeChip.style.display = 'none';
    }
    syncStickyOffsets();
  }

  // ---------- Step 2: product grid ----------
  var grid = document.getElementById('grid');
  var typeTabs = document.getElementById('typeTabs');
  var searchInput = document.getElementById('searchInput');
  var gridCount = document.getElementById('gridCount');
  var TYPES = []; PRODUCTS.forEach(function(p){ if(TYPES.indexOf(p.type) === -1) TYPES.push(p.type); });
  var currentTab = TYPES[0] || '의류';
  if(TYPES.length < 2){ typeTabs.style.display = 'none'; currentTab = 'all'; }
  var currentFiltered = [];

  function priceFmt(n){ return (n||0).toLocaleString('ko-KR') + '원'; }

  function isProductDone(id){
    var p = state.products[id];
    if(!p) return false;
    var crit = DATA.criteria[productById(id).type];
    return crit.every(function(c){ return p[c.key]; });
  }

  var _byId = null;
  function productById(id){
    if(!_byId){
      _byId = {};
      PRODUCTS.forEach(function(p){ _byId[p.id] = p; });
    }
    return _byId[id];
  }

  function renderGrid(){
    var q = searchInput.value.trim().toLowerCase();
    currentFiltered = PRODUCTS.filter(function(p){
      if(currentTab !== 'all' && p.type !== currentTab) return false;
      if(q && p.id.toLowerCase().indexOf(q) === -1 && (p.name||'').toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    grid.innerHTML = '';
    if(currentFiltered.length === 0){
      grid.appendChild(el('div','empty-state','검색 결과가 없습니다.'));
    }
    currentFiltered.forEach(function(p){
      var done = isProductDone(p.id);
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'card' + (done ? ' done' : '');
      card.setAttribute('data-id', p.id);
      var thumb = el('div','thumb','<img src="'+p.image+'" alt="'+p.name+'" loading="lazy">');
      card.appendChild(thumb);
      var body = el('div','body');
      body.appendChild(el('span','cat', p.category));
      body.appendChild(el('span','style-no', p.id));
      body.appendChild(el('span','name', p.name||''));
      body.appendChild(el('span','price', priceFmt(p.price)));
      body.appendChild(el('span','colors', (p.colors||[]).join(' / ')));
      if(done) body.appendChild(el('span','done-tag','✓ 평가 완료'));
      card.appendChild(body);
      card.addEventListener('click', function(){ openModal(p.id); });
      grid.appendChild(card);
    });
    gridCount.textContent = currentFiltered.length + '개 상품';
    updateProgress();
  }

  typeTabs.addEventListener('click', function(e){
    var btn = e.target.closest('.tab-btn');
    if(!btn) return;
    currentTab = btn.getAttribute('data-type');
    typeTabs.querySelectorAll('.tab-btn').forEach(function(b){
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    });
    renderGrid();
  });
  searchInput.addEventListener('input', renderGrid);

  // ---------- Modal ----------
  var modalOverlay = document.getElementById('modalOverlay');
  var modalImg = document.getElementById('modalImg');
  var modalCat = document.getElementById('modalCat');
  var modalName = document.getElementById('modalName');
  var modalSub = document.getElementById('modalSub');
  var modalDetail = document.getElementById('modalDetail');
  var modalColors = document.getElementById('modalColors');
  var modalCriteria = document.getElementById('modalCriteria');
  var modalEtc = document.getElementById('modalEtc');
  var modalEtcLabel = document.getElementById('modalEtcLabel');
  var modalSave = document.getElementById('modalSave');
  var modalPrev = document.getElementById('modalPrev');
  var modalClose = document.getElementById('modalClose');
  var currentModalId = null;

  function dtRow(label, val){
    if(!val) return '';
    return '<dt>'+label+'</dt><dd>'+val+'</dd>';
  }

  function openModal(id){
    currentModalId = id;
    var p = productById(id);
    modalImg.src = p.image; modalImg.alt = p.name || '';
    modalCat.textContent = p.category;
    modalName.textContent = p.name || '';
    modalSub.textContent = p.id + (p.line ? ' · ' + p.line + ' 라인' : '');
    var targetStr = [p.targetGender, p.targetAge, p.targetPurpose].filter(Boolean).join(' / ');
    modalDetail.innerHTML =
      dtRow('구분', p.priority) +
      dtRow('매장 입고', p.inStore) +
      dtRow('주요 판매시기', p.sellTiming) +
      dtRow('기획 타깃', targetStr) +
      dtRow('연계 품번', p.linked) +
      dtRow('판매가', priceFmt(p.price)) +
      (p.concept ? '<dt class="concept" style="grid-column:1/-1;color:var(--ink-soft);">기획의도</dt><dd class="concept">'+p.concept+'</dd>' : '');
    modalColors.innerHTML = '';
    (p.colors||[]).forEach(function(c){ modalColors.appendChild(el('span', null, c)); });

    var crit = DATA.criteria[p.type];
    var saved = state.products[id] || {};
    modalCriteria.innerHTML = '';
    crit.forEach(function(c){
      var row = el('div','qrow');
      var top = el('div','qrow-top');
      top.appendChild(el('span','qtext', c.label + ' — ' + c.question));
      row.appendChild(top);
      var likert = el('div','likert-mini');
      LIKERT.forEach(function(v){
        var label = el('label');
        var input = document.createElement('input');
        input.type = 'radio'; input.name = 'crit_'+c.key; input.value = v;
        if(saved[c.key] === v) input.checked = true;
        var span = el('span', null, String(v));
        label.appendChild(input); label.appendChild(span);
        likert.appendChild(label);
      });
      row.appendChild(likert);
      modalCriteria.appendChild(row);
    });
    modalEtcLabel.textContent = DATA.etcField.label + ' (' + DATA.etcField.question + ')';
    modalEtc.value = saved.etc || '';
    var idx = currentFiltered.findIndex(function(pp){ return pp.id === id; });
    modalPrev.disabled = idx <= 0;
    modalSave.textContent = '저장';
    modalOverlay.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    modalOverlay.hidden = true;
    document.body.style.overflow = '';
    currentModalId = null;
  }

  function persistCurrent(){
    if(!currentModalId) return;
    var p = productById(currentModalId);
    var crit = DATA.criteria[p.type];
    var rec = {};
    var filled = 0;
    crit.forEach(function(c){
      var checked = modalCriteria.querySelector('input[name="crit_'+c.key+'"]:checked');
      if(checked){ rec[c.key] = Number(checked.value); filled++; }
    });
    var etcVal = modalEtc.value.trim();
    if(etcVal) rec.etc = etcVal;
    if(filled > 0 || etcVal){
      state.products[currentModalId] = rec;
    } else {
      delete state.products[currentModalId];
    }
    saveDraft();
    renderGrid();
  }

  modalSave.addEventListener('click', function(){
    persistCurrent();
    showToast('저장되었습니다');
    closeModal();
  });
  modalPrev.addEventListener('click', function(){
    if(!currentModalId) return;
    var idx = currentFiltered.findIndex(function(pp){ return pp.id === currentModalId; });
    persistCurrent();
    if(idx > 0){
      openModal(currentFiltered[idx-1].id);
    }
  });
  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e){ if(e.target === modalOverlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !modalOverlay.hidden) closeModal(); });

  // ---------- Progress / gating ----------
  var progressBar = document.getElementById('progressBar');
  var doneCount = document.getElementById('doneCount');
  var totalCount = document.getElementById('totalCount');
  var submitBtn = document.getElementById('submitBtn');
  totalCount.textContent = PRODUCTS.length;

  function updateProgress(){
    var done = PRODUCTS.filter(function(p){ return isProductDone(p.id); }).length;
    doneCount.textContent = done;
    var pct = Math.round((done / PRODUCTS.length) * 100);
    progressBar.style.width = pct + '%';
  }

  function updateGates(){
    var storeOk = !!state.storeName;
    document.getElementById('productPanel').classList.toggle('disabled', !storeOk);
    submitBtn.disabled = !storeOk;
    if(storeOk && !storeAutoCollapsed){
      storeAutoCollapsed = true;
      toggleStorePanel(true);
    } else if(!storeOk){
      storeAutoCollapsed = false;
    }
  }

  // ---------- Submit ----------
  function buildPayload(){
    var productMeta = {};
    Object.keys(state.products).forEach(function(id){
      var p = productById(id);
      productMeta[id] = { name: p.name, category: p.category, type: p.type };
    });
    return {
      version: 3,
      survey: SURVEY,
      submittedAt: new Date().toISOString(),
      channelType: state.channelType,
      channelGroup: state.channelGroup,
      storeName: state.storeName,
      common: {},
      products: state.products,
      productMeta: productMeta
    };
  }

  function downloadJsonFallback(jsonStr, filename){
    var blob = new Blob([jsonStr], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  }

  function showDoneScreen(){
    document.querySelectorAll('.topbar, main, .bottombar').forEach(function(n){ n.remove(); });
    var wrap = el('div','done-screen');
    wrap.innerHTML = '<div class="icon">✓</div>' +
      '<h2>제출 완료</h2>' +
      '<p class="hint">'+state.storeName+' 매장의 평가 결과가 정상적으로 저장되었습니다.<br>참여해주셔서 감사합니다.</p>';
    document.body.appendChild(wrap);
  }

  var submitErrorBox = null;
  function showSubmitError(message, jsonStr, filename){
    if(submitErrorBox) submitErrorBox.remove();
    submitErrorBox = el('div','error-banner');
    submitErrorBox.innerHTML = '전송 중 문제가 발생했습니다: ' + message + ' — 인터넷 연결을 확인한 뒤 다시 시도해주세요.';
    var retryBtn = el('button','btn btn-outline','다시 시도');
    retryBtn.type = 'button';
    retryBtn.style.marginLeft = 'auto';
    retryBtn.addEventListener('click', doSubmit);
    var saveBtn = el('button','btn btn-outline','파일로 저장');
    saveBtn.type = 'button';
    saveBtn.addEventListener('click', function(){ downloadJsonFallback(jsonStr, filename); showToast('파일이 저장되었습니다'); });
    submitErrorBox.appendChild(retryBtn);
    submitErrorBox.appendChild(saveBtn);
    document.querySelector('main').appendChild(submitErrorBox);
    submitErrorBox.scrollIntoView({behavior:'smooth', block:'center'});
  }

  function doSubmit(){
    var payload = buildPayload();
    var jsonStr = JSON.stringify(payload);
    var filename = state.storeName + '_SS27Summer품평결과.json';
    submitBtn.disabled = true;
    submitBtn.textContent = '제출 중…';
    if(submitErrorBox){ submitErrorBox.remove(); submitErrorBox = null; }

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: jsonStr
    }).then(function(res){ return res.json(); })
      .then(function(data){
        if(data && data.ok){
          clearDraft();
          showDoneScreen();
        } else {
          submitBtn.disabled = false; submitBtn.textContent = '결과 제출';
          showSubmitError((data && data.error) || '알 수 없는 오류', jsonStr, filename);
        }
      })
      .catch(function(err){
        submitBtn.disabled = false; submitBtn.textContent = '결과 제출';
        showSubmitError(String(err && err.message || err), jsonStr, filename);
      });
  }

  submitBtn.addEventListener('click', function(){
    var allDone = PRODUCTS.every(function(p){ return isProductDone(p.id); });
    if(!allDone){
      alert('평가 완료되지 않은 상품이 있습니다. 완료 후 제출해주세요.');
      return;
    }
    doSubmit();
  });

  // ---------- init ----------
  loadDraft();
  if(state.channelType){
    selType.value = state.channelType;
    fillGroups(state.channelType, state.channelGroup);
  }
  updateStoreChip();
  renderGrid();
  updateGates();
  syncStickyOffsets();
})();
</script>
</body>
</html>
